<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>عقل أحمد</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg: #FFFFFF;
  --bg2: #F2F2F7;
  --card: #FFFFFF;
  --sep: #C6C6C8;
  --label: #000000;
  --sublabel: #3C3C43;
  --caption: #8E8E93;
  --accent: #000000;
  --accent-soft: #F2F2F7;
  --danger: #FF3B30;
  --radius-card: 16px;
  --radius-btn: 12px;
  --font: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg2);
  color: var(--label);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── Lock Screen ── */
#lockScreen {
  position: fixed; inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 0;
  padding: 40px 32px;
}

.lock-icon {
  font-size: 52px;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 20px rgba(255,255,255,0.15));
}

.lock-title {
  color: #fff;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}

.lock-sub {
  color: rgba(255,255,255,0.45);
  font-size: 14px;
  margin-bottom: 44px;
  letter-spacing: 0.1px;
}

.pin-dots {
  display: flex;
  gap: 18px;
  margin-bottom: 44px;
}

.pin-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.35);
  transition: all 0.15s;
}
.pin-dot.filled {
  background: #fff;
  border-color: #fff;
  transform: scale(1.1);
}
.pin-dot.error {
  background: var(--danger);
  border-color: var(--danger);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}

.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 300px;
}

.num-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 76px; height: 76px;
  color: #fff;
  font-size: 26px;
  font-weight: 400;
  font-family: var(--font);
  cursor: pointer;
  transition: background 0.1s, transform 0.1s;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  justify-self: center;
}
.num-btn:active { background: rgba(255,255,255,0.22); transform: scale(0.93); }
.num-btn .num-letters {
  font-size: 9px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  margin-top: 2px;
}
.num-btn.del-btn { font-size: 22px; background: transparent; }
.num-btn.empty   { background: transparent; pointer-events: none; }

/* ── App ── */
#app { display: none; min-height: 100dvh; }

/* Header */
.app-header {
  background: rgba(255,255,255,0.85);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--sep);
  padding: 56px 20px 14px;
  position: sticky; top: 0; z-index: 10;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.header-title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.8px;
  line-height: 1;
}
.header-sub {
  font-size: 12px;
  color: var(--caption);
  margin-top: 3px;
}

.logout-btn {
  background: none;
  border: none;
  color: var(--danger);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  padding: 6px 0 6px 8px;
  font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}

/* Cards Grid */
.cards-wrap {
  padding: 20px 16px 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.section-card {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: 20px 16px 18px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 110px;
  -webkit-user-select: none; user-select: none;
}
.section-card:active { transform: scale(0.96); box-shadow: none; }

.card-icon { font-size: 28px; }
.card-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.card-desc {
  font-size: 12px;
  color: var(--caption);
  line-height: 1.4;
}

/* ── Section View (sheet) ── */
#sectionView {
  position: fixed; inset: 0;
  background: var(--bg2);
  z-index: 50;
  display: none;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
}
#sectionView.open {
  display: flex;
  transform: translateY(0);
}

.sheet-header {
  background: rgba(242,242,247,0.9);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  padding: 54px 20px 12px;
  border-bottom: 0.5px solid var(--sep);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.sheet-title-wrap { display: flex; align-items: center; gap: 10px; }
.sheet-icon { font-size: 24px; }
.sheet-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }

.close-btn {
  background: var(--accent-soft);
  border: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--caption);
  font-weight: 600;
  transition: background 0.15s;
}
.close-btn:active { background: var(--sep); }

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Input area */
.input-card {
  background: var(--card);
  border-radius: var(--radius-card);
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.input-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--caption);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 12px 16px 0;
}
.input-card textarea {
  width: 100%;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--label);
  background: transparent;
  padding: 10px 16px 16px;
  resize: none;
  min-height: 120px;
  direction: auto;
}
.input-card textarea::placeholder { color: var(--caption); }

/* Run button */
.run-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-btn);
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: -0.2px;
}
.run-btn:active { opacity: 0.8; transform: scale(0.98); }
.run-btn:disabled { opacity: 0.4; }

/* Result */
.result-card {
  background: var(--card);
  border-radius: var(--radius-card);
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  display: none;
}
.result-card.visible { display: block; }

.result-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 0;
}
.result-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--caption);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.copy-btn {
  background: none;
  border: none;
  color: #007AFF;
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  font-weight: 500;
  padding: 0;
}

.result-text {
  padding: 10px 16px 18px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--label);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Loader */
.loader-wrap {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.loader-wrap.show { display: flex; }
.loader-dots { display: flex; gap: 5px; }
.loader-dots span {
  width: 7px; height: 7px;
  background: var(--caption);
  border-radius: 50%;
  animation: ldot 1.2s infinite;
  opacity: 0.3;
}
.loader-dots span:nth-child(2) { animation-delay: 0.2s; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes ldot {
  0%,80%,100% { opacity:0.3; transform:scale(1); }
  40%          { opacity:1;   transform:scale(1.25); }
}
.loader-text { font-size: 13px; color: var(--caption); }

/* Error */
.error-msg {
  background: #FFF2F2;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  color: var(--danger);
  display: none;
}
.error-msg.show { display: block; }
</style>
</head>
<body>

<!-- ══════════ LOCK SCREEN ══════════ -->
<div id="lockScreen">
  <div class="lock-icon">🧠</div>
  <div class="lock-title">عقل أحمد</div>
  <div class="lock-sub">أدواتك الشخصية</div>

  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="addPin('1')">1</button>
    <button class="num-btn" onclick="addPin('2')">2<div class="num-letters">ABC</div></button>
    <button class="num-btn" onclick="addPin('3')">3<div class="num-letters">DEF</div></button>
    <button class="num-btn" onclick="addPin('4')">4<div class="num-letters">GHI</div></button>
    <button class="num-btn" onclick="addPin('5')">5<div class="num-letters">JKL</div></button>
    <button class="num-btn" onclick="addPin('6')">6<div class="num-letters">MNO</div></button>
    <button class="num-btn" onclick="addPin('7')">7<div class="num-letters">PQRS</div></button>
    <button class="num-btn" onclick="addPin('8')">8<div class="num-letters">TUV</div></button>
    <button class="num-btn" onclick="addPin('9')">9<div class="num-letters">WXYZ</div></button>
    <button class="num-btn empty"></button>
    <button class="num-btn" onclick="addPin('0')">0</button>
    <button class="num-btn del-btn" onclick="delPin()">⌫</button>
  </div>
</div>

<!-- ══════════ MAIN APP ══════════ -->
<div id="app">
  <div class="app-header">
    <div>
      <div class="header-title">عقل أحمد</div>
      <div class="header-sub">Ahmad Brain · أدواتك الشخصية</div>
    </div>
    <button class="logout-btn" onclick="logout()">
      تسجيل خروج
    </button>
  </div>

  <div class="cards-wrap" id="cardsWrap">
    <!-- Card: دفتري -->
    <div class="section-card" onclick="openSection('daftari')">
      <div class="card-icon">✍️</div>
      <div class="card-name">دفتري</div>
      <div class="card-desc">تحويل النص إلى أدب بأسلوب Show Don't Tell</div>
    </div>
    <!-- placeholder for future sections -->
    <div class="section-card" style="opacity:0.35;pointer-events:none;border:1.5px dashed #C6C6C8;box-shadow:none;background:transparent;">
      <div class="card-icon">＋</div>
      <div class="card-name" style="color:#8E8E93">قسم جديد</div>
      <div class="card-desc">قريباً…</div>
    </div>
  </div>
</div>

<!-- ══════════ SECTION SHEET ══════════ -->
<div id="sectionView">
  <div class="sheet-header">
    <div class="sheet-title-wrap">
      <span class="sheet-icon" id="sheetIcon">✍️</span>
      <span class="sheet-title" id="sheetTitle">دفتري</span>
    </div>
    <button class="close-btn" onclick="closeSection()">✕</button>
  </div>

  <div class="sheet-body">
    <div class="input-card">
      <div class="input-label">النص المدخل</div>
      <textarea id="userText" placeholder="اكتب أو الصق نصك هنا…" oninput="onInput()"></textarea>
    </div>

    <div class="loader-wrap" id="loader">
      <div class="loader-dots"><span></span><span></span><span></span></div>
      <div class="loader-text">يعالج النص…</div>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <button class="run-btn" id="runBtn" onclick="runSection()" disabled>حوّل النص ✦</button>

    <div class="result-card" id="resultCard">
      <div class="result-label-row">
        <div class="result-label">النتيجة</div>
        <button class="copy-btn" onclick="copyResult()">نسخ</button>
      </div>
      <div class="result-text" id="resultText"></div>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────
const CORRECT_PIN = "1234"; // ← غيّر هذا الرقم السري
const WORKER_URL  = "https://brain.aalatieh93.workers.dev";

// ── Sections ────────────────────────────────────
const SECTIONS = {
  daftari: {
    icon: "✍️",
    name: "دفتري",
    prompt: (text) => `أنت أعظم كاتب أدبي في التاريخ، متخصص في أسلوب "Show, Don't Tell" بطريقة عميقة وقوية.
مهمتك: حوّل النص التالي إلى نص أدبي قوي، بسيط جداً في الكلمات، لكنه يولّد أفكاراً وعواطف وردود أفعال معقدة في ذهن القارئ.
القواعد الصارمة التي يجب اتباعها:
1. أظهر فقط، لا تخبر أبداً — ممنوع تماماً استخدام كلمات: شعر، يشعر، حزن، فرح، غضب، غربة، عزلة، ارتباك، خوف، يأس، حب، كره… (وأي كلمة تعبر عن شعور مباشر).
2. استخدم تفاصيل حسية وصور ملموسة (ما يُرى، يُسمع، يُلمس، يُشم).
3. استغل الفراغ — اجعل القارئ هو من يملأ المعنى والعاطفة.
4. الإيقاع مهم — الجمل قصيرة أو متوسطة، متدفقة، سهلة القراءة بصوت عالٍ.
5. ابقِ النص موجزاً — قلّل عدد الكلمات قدر الإمكان مع الحفاظ على القوة (عادة 30-70% من طول النص الأصلي).
6. حافظ على الروح والمعنى الأساسي للنص الأصلي، لكن ارفع مستواه أدبياً بشكل كبير.

النص الذي يجب تحويله:
${text}`
  }
};

// ── PIN Logic ────────────────────────────────────
let pin = "";

function addPin(num) {
  if (pin.length >= 4) return;
  pin += num;
  updateDots();
  if (pin.length === 4) checkPin();
}

function delPin() {
  pin = pin.slice(0, -1);
  updateDots();
}

function updateDots(state) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById("d" + i);
    d.className = "pin-dot";
    if (state === "error") d.classList.add("error");
    else if (i < pin.length) d.classList.add("filled");
  }
}

function checkPin() {
  if (pin === CORRECT_PIN) {
    setTimeout(() => {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("app").style.display = "block";
    }, 180);
  } else {
    updateDots("error");
    setTimeout(() => { pin = ""; updateDots(); }, 700);
  }
}

// ── Logout ───────────────────────────────────────
function logout() {
  // Clear session
  pin = "";
  document.getElementById("userText").value = "";
  document.getElementById("resultText").textContent = "";
  document.getElementById("resultCard").classList.remove("visible");
  document.getElementById("errMsg").classList.remove("show");
  closeSection();

  document.getElementById("app").style.display = "none";
  document.getElementById("lockScreen").style.display = "flex";
  updateDots();
}

// ── Section Sheet ────────────────────────────────
let currentSection = null;

function openSection(key) {
  const sec = SECTIONS[key];
  if (!sec) return;
  currentSection = key;

  document.getElementById("sheetIcon").textContent = sec.icon;
  document.getElementById("sheetTitle").textContent = sec.name;
  document.getElementById("userText").value = "";
  document.getElementById("resultText").textContent = "";
  document.getElementById("resultCard").classList.remove("visible");
  document.getElementById("errMsg").classList.remove("show");
  document.getElementById("runBtn").disabled = true;
  document.getElementById("loader").classList.remove("show");

  const view = document.getElementById("sectionView");
  view.style.display = "flex";
  requestAnimationFrame(() => view.classList.add("open"));
  setTimeout(() => document.getElementById("userText").focus(), 400);
}

function closeSection() {
  const view = document.getElementById("sectionView");
  view.classList.remove("open");
  setTimeout(() => { view.style.display = "none"; }, 380);
  currentSection = null;
}

function onInput() {
  const val = document.getElementById("userText").value.trim();
  document.getElementById("runBtn").disabled = val.length === 0;
  document.getElementById("errMsg").classList.remove("show");
}

// ── Run ──────────────────────────────────────────
async function runSection() {
  const text = document.getElementById("userText").value.trim();
  if (!text || !currentSection) return;

  const sec = SECTIONS[currentSection];
  const fullPrompt = sec.prompt(text);

  document.getElementById("runBtn").disabled = true;
  document.getElementById("loader").classList.add("show");
  document.getElementById("resultCard").classList.remove("visible");
  document.getElementById("errMsg").classList.remove("show");

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: fullPrompt })
    });

    const data = await res.json();

    if (!res.ok || data.error) throw new Error(data.error || "خطأ غير معروف");

    document.getElementById("resultText").textContent = data.result;
    document.getElementById("resultCard").classList.add("visible");

    // scroll to result
    setTimeout(() => {
      document.getElementById("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
    }, 100);

  } catch (err) {
    const errEl = document.getElementById("errMsg");
    errEl.textContent = "⚠️ " + (err.message || "تعذّر الاتصال، تحقق من الإنترنت.");
    errEl.classList.add("show");
  } finally {
    document.getElementById("loader").classList.remove("show");
    document.getElementById("runBtn").disabled = false;
  }
}

// ── Copy ─────────────────────────────────────────
function copyResult() {
  const txt = document.getElementById("resultText").textContent;
  if (!txt) return;
  navigator.clipboard?.writeText(txt).then(() => {
    const btn = document.querySelector(".copy-btn");
    btn.textContent = "✓ تم النسخ";
    setTimeout(() => btn.textContent = "نسخ", 1800);
  });
}
</script>
</body>
</html>
